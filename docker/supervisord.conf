[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/data/logs/supervisord.log
logfile_maxbytes=5MB
logfile_backups=2
pidfile=/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; ---------------------------------------------------------------- 管理面板 + 采集 + 转发（常驻）
[program:manager]
command=/opt/manager/venv/bin/python -m uvicorn app:app --app-dir /opt/manager --host 0.0.0.0 --port %(ENV_WEB_PORT)s --proxy-headers
directory=/opt/manager
autostart=true
autorestart=true
priority=1
stdout_logfile=/data/logs/manager.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true

; ---------------------------------------------------------------- 微信⇄TG 桥接（常驻；未配置 token 时空转）
[program:bridge]
command=/opt/manager/venv/bin/python -m bridge
directory=/opt/manager
autostart=true
autorestart=true
priority=2
stdout_logfile=/data/logs/bridge.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true

; ---------------------------------------------------------------- 显示栈（常驻）
[program:xvfb]
command=/opt/scripts/start-xvfb.sh
autostart=true
autorestart=true
priority=10
stdout_logfile=/data/logs/display.log
redirect_stderr=true

[program:openbox]
command=bash -c 'for i in $(seq 1 30); do [ -S /tmp/.X11-unix/X${DISPLAY#:} ] && break; sleep 1; done; exec openbox'
autostart=true
autorestart=true
startretries=20
priority=20
stdout_logfile=/data/logs/display.log
redirect_stderr=true

[program:x11vnc]
command=bash -c 'for i in $(seq 1 30); do [ -S /tmp/.X11-unix/X${DISPLAY#:} ] && break; sleep 1; done; exec x11vnc -display %(ENV_DISPLAY)s -rfbport %(ENV_VNC_PORT)s -localhost -nopw -forever -shared -noxdamage -xkb -quiet'
autostart=true
autorestart=true
startretries=20
priority=30
stdout_logfile=/data/logs/display.log
redirect_stderr=true

; ---------------------------------------------------------------- 微信（常驻；崩溃自动拉起）
[program:wechat]
command=/opt/scripts/start-wechat.sh
autostart=true
autorestart=true
startsecs=5
startretries=50
stopsignal=TERM
stopwaitsecs=15
killasgroup=true
stopasgroup=true
priority=40
stdout_logfile=/data/logs/wechat.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true
