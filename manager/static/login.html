<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wechat2tg</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="login-box card">
    <h2 style="margin-top:0">wechat2tg 管理面板</h2>
    <p class="muted">请输入管理密码（环境变量 <code>WEB_PASSWORD</code>；未设置时见 <code>data/.web_password</code>）。</p>
    <form id="f">
      <input type="password" id="pw" placeholder="管理密码" autofocus>
      <div class="row" style="margin-top:12px"><button class="btn primary" type="submit">登录</button><span id="err" style="color:var(--bad)"></span></div>
    </form>
  </div>
  <script src="/static/login.js"></script>
</body>
</html>
